<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — QuestõesCardsAI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; color: #1E293B; background: #F8FAFC; -webkit-font-smoothing: antialiased; }

    .card { border: 1px solid #E2E8F0; border-radius: 12px; padding: 32px; background: #fff; }

    .input-field { width: 100%; padding: 11px 14px; border: 1px solid #E2E8F0; border-radius: 8px; font-size: 14px; color: #1E293B; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; font-family: inherit; }
    .input-field:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .input-field::placeholder { color: #94A3B8; }

    .btn-primary { display: block; width: 100%; background: #2563EB; color: #fff; border: none; border-radius: 8px; padding: 12px 24px; font-weight: 600; font-size: 14px; cursor: pointer; transition: opacity .15s; text-align: center; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .alert-error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; border-radius: 8px; padding: 12px 14px; font-size: 13px; }
    .alert-success { background: #F0FDF4; color: #15803D; border: 1px solid #BBF7D0; border-radius: 8px; padding: 12px 14px; font-size: 13px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .card { padding: 20px 16px; }
      main { padding: 20px 16px !important; }
      h1 { font-size: 20px !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header minimal -->
  <header style="background:#fff;border-bottom:1px solid #E2E8F0;">
    <div class="max-w-screen-xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="/index.html" style="font-size:17px;font-weight:700;color:#1E293B;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;">QuestõesCardsAI</a>
      <a href="/login.html" style="font-size:13px;color:#2563EB;text-decoration:none;font-weight:500;white-space:nowrap;">Já tenho conta →</a>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div style="width:100%;max-width:380px;">

      <div class="text-center mb-8">
        <h1 style="font-size:22px;font-weight:700;color:#1E293B;margin-bottom:6px;">Criar conta grátis</h1>
        <p style="font-size:14px;color:#475569;">2 gerações grátis · Sem cartão de crédito</p>
      </div>

      <div class="card">
        <form id="registerForm" class="space-y-4">

          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:#1E293B;margin-bottom:6px;">Nome</label>
            <input id="name" type="text" placeholder="Seu nome completo" class="input-field" />
          </div>

          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:#1E293B;margin-bottom:6px;">Email</label>
            <input id="email" type="email" required placeholder="seu@email.com" class="input-field" />
          </div>

          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:#1E293B;margin-bottom:6px;">Senha</label>
            <input id="password" type="password" required placeholder="Mínimo 6 caracteres" class="input-field" />
          </div>

          <div>
            <label style="display:block;font-size:13px;font-weight:600;color:#1E293B;margin-bottom:6px;">Confirmar senha</label>
            <input id="confirmPassword" type="password" required placeholder="Repita a senha" class="input-field" />
          </div>

          <div id="errorMsg" class="hidden alert-error"></div>
          <div id="successMsg" class="hidden alert-success"></div>

          <button type="submit" id="submitBtn" class="btn-primary" style="margin-top:8px;">Criar conta grátis</button>
        </form>

        <p style="font-size:13px;color:#475569;text-align:center;margin-top:24px;padding-top:24px;border-top:1px solid #E2E8F0;">
          Já tem conta?
          <a href="/login.html" style="color:#2563EB;font-weight:600;text-decoration:none;"> Entrar</a>
        </p>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer style="border-top:1px solid #E2E8F0;padding:20px 24px;text-align:center;background:#fff;">
    <p style="font-size:12px;color:#94A3B8;">© 2025 QuestõesCardsAI</p>
  </footer>

  <script src="/js/config.js"></script>
  <script>
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/dashboard.html';
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errDiv = document.getElementById('errorMsg');
      const sucDiv = document.getElementById('successMsg');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      errDiv.classList.add('hidden');
      sucDiv.classList.add('hidden');

      if (password.length < 6) {
        errDiv.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
        errDiv.classList.remove('hidden');
        return;
      }
      if (password !== confirm) {
        errDiv.textContent = 'As senhas não coincidem.';
        errDiv.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<svg style="display:inline;width:16px;height:16px;animation:spin 1s linear infinite;margin-right:8px;vertical-align:-3px" viewBox="0 0 24 24" fill="none"><circle opacity=".25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path opacity=".75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/></svg>Criando conta…';

      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: name },
          emailRedirectTo: `${window.location.origin}/dashboard.html`,
        },
      });

      if (error) {
        errDiv.textContent = error.message;
        errDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Criar conta grátis';
        return;
      }

      if (data.session && name) {
        await db.from('profiles').update({ full_name: name }).eq('id', data.user.id);
        window.location.href = '/dashboard.html';
        return;
      }

      sucDiv.textContent = 'Conta criada! Verifique seu e-mail para confirmar o cadastro.';
      sucDiv.classList.remove('hidden');
      btn.textContent = 'E-mail enviado!';
    });
  </script>
</body>
</html>
